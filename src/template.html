<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Lexicourse v0.17 — comptes par code et écran prof (Realtime Database)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;height:100%;background:#05071a;overflow:hidden}canvas{position:absolute;inset:0;margin:auto;touch-action:none}</style></head><body>
<canvas id="c" width="960" height="540"></canvas>
<script>
const A=/*ASSETS*/;
const W=960,H=540,cv=document.getElementById('c'),g=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}addEventListener('resize',fit);fit();

// ===== RÉGLAGES (monde : la route fait 2×ROAD de large = 4 voies de 1000) =====
const SEG=200,ROAD=2000,LANES=4,CAMH=1000,DEPTH=1/Math.tan(50*Math.PI/180),DRAW=300,FOG=5,K=A.k;
const MAXV=6000,ACC=MAXV/4,ROBOT=.55,BOOST=1.45,DRAIN=28,UNLOCK=4,TR=.6,COOL=3;   // robot = 55 % de la vitesse de la route ; le boost vide la jauge en ~3,5 s ; robot débloqué après 4 portiques
const LX=[-.75,-.25,.25,.75],GATE0=20000,EVERY=36000,SHOW=45000,LOCK=3500;   // LOCK : à cette distance du portique, la voie choisie est verrouillée     // centres des voies, 1er portique, écart entre portiques, distance d'apparition de la consigne

// ===== BANQUE DE QUESTIONS : [consigne, [4 mots], index de la bonne réponse, explication] =====
const Q=/*QUESTIONS*/;

// ===== PISTE 1 = DONNÉES : [segments, virage (+ droite / − gauche), dénivelé] =====
const TRACK=[[160,0,0],[120,2,0],[160,0,3000],[120,-3,0],[200,0,-3000],[160,4,0],[120,0,2000],[160,-2,-2000],[160,0,0],[160,3,1500],[160,-3,-1500],[120,0,0]];
const segs=[];let y0=0,seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
for(const[n,c,dy]of TRACK){for(let k=0;k<n;k++){const i=segs.length;
  segs.push({i,curve:c*Math.sin(Math.PI*(k+.5)/n),spr:[],a:{wy:y0+dy*(1-Math.cos(Math.PI*k/n))/2,wz:i*SEG},b:{wy:y0+dy*(1-Math.cos(Math.PI*(k+1)/n))/2,wz:(i+1)*SEG}})}
  y0+=dy}
const N=segs.length,LEN=N*SEG,SPR0=LEN*.8;   // SPR0 = début du sprint final (sans questions)

// ===== ÉTAT =====
let pos=0,x=LX[1],ln=1,v=0,lap=0,lapT=0,bgX=0,car=0,form=0,fps=60,score=0,ok=0,tot=0,qi=0,paused=0,reveal=null,mode='home',code='',hb=0,surprise=null,HOME,res=null,pending=[],lapOk=0,lapTot=0,gauge=0,boosting=0,passed=0,robotOn=0,spOn=0,spT=0;
let tr={t:0,dir:1},act={t:0,d:.8,k:'jump'},cool=0,boostT=0,slowT=0,shake=0,msg={t:'',life:0,ok:1},vis=[],btns=[],CH=[],FAM=[],pageM=0,colPage=0,detail=-1,OB={},BG;
const gates=[];
let pz=0,colBack='hub';   // pz : course en pause ; colBack : écran où revient la Collection
function newQ(gt){const q=Q[qi++%Q.length],o=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.random()*(i+1)|0;[o[i],o[j]]=[o[j],o[i]]}
  Object.assign(gt,{q:q[0],k:qkey(q[0]),w:o.map(i=>q[1][i]),c:o.indexOf(q[2]),e:q[3],t:pickT(),done:0,L:undefined})}
const pickT=()=>{const a=robotOn?['barrier','blocks','ramp','pool']:['barrier','ramp'];return a[Math.random()*a.length|0]};
const newS=gt=>Object.assign(gt,{sp:1,c:Math.random()*4|0,t:pickT(),done:0});
const say=(t,o)=>msg={t,life:4.5,ok:o};

// ===== PROFIL ET COLLECTION : sauvegarde dans le navigateur + Firebase si une configuration est fournie =====
const SK='lexicourse_v1',WIN_PCT=.7,PITY=3;   // WIN_PCT : % de bonnes réponses pour avoir une chance de carte ; PITY : carte garantie après 3 courses réussies sans carte
// ===== PROGRESSION DES CARTES : tous les réglages sont ici =====
const PR={base:[70,27,3],      // chances de base (%) : commune, rare, extra-rare
  luckRare:10,luckExtra:6,     // gain (points de %) par « point de chance » (beau score, sans-faute, adversaire battu)
  pityRare:6,pityExtra:1.5,    // gain par tirage sans rare / sans extra-rare (la malchance est compensée)
  caps:[100,60,35],            // plafonds (%) rare et extra-rare
  chance:.5,chanceLuck:.15,    // chance d'avoir une carte après une course réussie, + par point de chance
  goodAcc:.85};                // seuil de « belle course »
const RV={depart:-1,commune:0,rare:1,epique:1,extra:2},RN=['Commune','Rare','Extra-rare'],RC=['#8fb8ff','#d78bff','#ff6bd6'],rar=i=>RV[CH[i].rarete],tierOf=i=>RV[CH[i].rarete];   // la rareté de chaque carte est choisie dans src/personnages.json ("epique" compte comme rare)
let prof={owned:[],ok:0,tot:0,pseudo:'',classe:''},cloud=null;
let cheat={ok:0,gauge:0},tp=null,pf={tab:'outils',list:[],sel:-1,msg:'',snap:null,cls:'',off:0,busy:0,k:0};   // écran prof : triche, session, état
const qkey=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return(h>>>0).toString(36)};   // identifiant court d'une question
try{Object.assign(prof,JSON.parse(localStorage.getItem(SK)||'{}'))}catch(e){}
function save(){prof.passed=passed;if(CH.length)prof.cartes=CH.filter((c,i)=>prof.owned[i]).map(c=>c.id);try{localStorage.setItem(SK,JSON.stringify(prof,(k,v)=>k=='owned'?undefined:v))}catch(e){}if(cloud&&!tp)cloud.push()}
const own=()=>prof.owned.reduce((a,b)=>a+b,0);
function tierWeights(luck){const dR=prof.dryR|0,dE=prof.dryE|0,x=Math.min(PR.caps[2],PR.base[2]+PR.luckExtra*luck+PR.pityExtra*dE),r=Math.min(PR.caps[1],PR.base[1]+PR.luckRare*luck+PR.pityRare*dR);return[Math.max(0,100-x-r),r,x]}
function pickCard(luck,force,not){const by=[0,1,2].map(t=>CH.map((c,i)=>i).filter(i=>!prof.owned[i]&&tierOf(i)==t&&CH[i].id!=not));
  let w=force!=null?[0,1,2].map(t=>t==force?1:0):tierWeights(luck);w=w.map((x,t)=>by[t].length?x:0);
  if(!w.some(x=>x>0)){w=by.map(l=>l.length?1:0);if(!w.some(x=>x>0))return -1}
  let r=Math.random()*w.reduce((a,b)=>a+b,0),t=0;for(;t<2;t++){r-=w[t];if(r<=0)break}
  const l=by[t];return l[Math.floor(Math.random()*l.length)]}
function grant(k){prof.owned[k]=1;const t=tierOf(k);prof.dryR=t>=1?0:(prof.dryR|0)+1;prof.dryE=t>=2?0:(prof.dryE|0)+1;save();reveal={i:k,t:0}}
function draw(rq){const k=pickCard(rq.luck|0,rq.force);if(k<0){say('Collection complète ! Bravo !',1);return false}grant(k);return true}
// Adversaire-carte (courses, chantier B) : une carte que l'élève ne possède pas, jamais la même deux courses de suite ; plus elle est rare, plus elle est dure à battre ; battue = obtenue
let rivalWon=0;const rivalPower=i=>[.45,.7,.95][tierOf(i)];
function pickRival(luck){const k=pickCard(luck|0,null,prof.lastRival);if(k>=0)prof.lastRival=CH[k].id;return k}
function winRival(i){rivalWon=1;grant(i)}
const STC={1:'#8fb8ff',2:'#8fb8ff',3:'#d78bff',4:'#ffc23d',5:'#ff6bd6'},TN={feu:'Feu',electrique:'Électrique',energie:'Énergie',eau:'Eau',force:'Force',glace:'Glace',love:'Amour',nature:'Nature',tenebre:'Ténèbre'};
function drawCard(c,x,y,w,h,own){g.save();g.textAlign='left';g.beginPath();g.roundRect(x,y,w,h,w*.06);g.clip();
  if(own&&c.cardImg){g.drawImage(prof.robot?c.cardImg:(c.cardCarImg||c.cardImg),x,y,w,h);const f=h*.07,sx=x+w*.06,sy=y+h*.03;g.font='bold '+f+'px system-ui';g.textBaseline='top';g.lineWidth=f*.14;g.strokeStyle='#000';g.fillStyle='#ffc23d';const st='★'.repeat(c.etoiles);g.strokeText(st,sx,sy);g.fillText(st,sx,sy);g.textBaseline='alphabetic';   // étoiles en haut à gauche
    const gr=g.createLinearGradient(0,y+h*.83,0,y+h);gr.addColorStop(0,'rgba(2,6,25,0)');gr.addColorStop(1,'rgba(2,6,25,.93)');g.fillStyle=gr;g.fillRect(x,y+h*.83,w,h*.17);
    g.fillStyle='#fff';g.textAlign='center';let fs=h*.046;g.font='bold '+fs+'px system-ui';while(g.measureText(c.label).width>w*.9&&fs>6){fs--;g.font='bold '+fs+'px system-ui'}g.fillText(c.label,x+w/2,y+h*.955);g.textAlign='left'}   // nom en bas
  else{g.fillStyle='#161a33';g.fillRect(x,y,w,h);g.fillStyle='#3a4160';g.textAlign='center';g.font='bold '+h*.3+'px system-ui';g.fillText('?',x+w/2,y+h*.62);g.textAlign='left'}
  g.restore();g.strokeStyle=own?(STC[c.etoiles]||'#fff'):'#2a2f45';g.lineWidth=Math.max(2,w*.02);g.beginPath();g.roundRect(x,y,w,h,w*.06);g.stroke()}
const etyTxt=c=>'« '+c.label+' » vient '+c.ety.replace(/^les /,'des ')+'.';
function card(){const c=CH[reveal.i],u=Math.min(1,reveal.t/.6);g.fillStyle='rgba(3,6,25,.9)';g.fillRect(0,0,W,H);g.textAlign='center';
  g.fillStyle=STC[c.etoiles]||'#fff';g.font='bold 24px system-ui';g.fillText('NOUVELLE CARTE !',W/2,34);g.save();g.translate(W/2,H/2+4);g.scale(.4+.6*u,.4+.6*u);g.globalAlpha=u;drawCard(c,-150,-225,300,450,1);g.restore();
  g.fillStyle='#fff';g.font='15px system-ui';g.fillText((TN[c.type]||'')+'  ·  '+c.part,W/2,H-24);if(c.ety){g.fillStyle='#ffc23d';g.font='italic 14px system-ui';g.fillText('Le savais-tu ? '+etyTxt(c),W/2,H-46)}
  if(reveal.t>1.2){g.fillStyle='#9fe8ff';g.font='14px system-ui';g.fillText('Clique ou appuie sur une touche pour continuer',W/2,H-6)}g.textAlign='left'}
// ===== COMPTES ÉLÈVES : Realtime Database, un nœud par code à 4 chiffres (jeux/lexicourse/<code>) =====
const LP='jeux/lexicourse/';let cloudP=null,cloudErr='';
async function fbStudent(){if(window.__fbStudent)return window.__fbStudent();const B='https://www.gstatic.com/firebasejs/10.12.2/',[{initializeApp},{getAuth,signInAnonymously},{getDatabase,ref,get,set,serverTimestamp}]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-database.js')]);
  const app=initializeApp(A.firebase);await signInAnonymously(getAuth(app));return{db:getDatabase(app),ref,get,set,serverTimestamp}}
function initCloud(){if(cloudP||!A.firebase)return cloudP;
  cloudP=(async()=>{try{const f=await fbStudent();cloud=Object.assign(f,{code:prof.code||'',tm:0,
    push(){clearTimeout(this.tm);this.tm=setTimeout(()=>this.pushNow(),1500)},
    pushNow(){if(!this.code||tp)return;const d={pseudo:prof.pseudo||'',classe:prof.classe||'',cartes:CH.filter((x,i)=>prof.owned[i]).map(x=>x.id),ok:prof.ok|0,tot:prof.tot|0,tuto:!!prof.tuto,robot:!!prof.robot,races:prof.races|0,passed:prof.passed|0,hist:(prof.hist||[]).slice(-30),q:Object.fromEntries(Object.entries(prof.q||{}).slice(0,80))},s=JSON.stringify(d);if(s.length>55000)return;
      this.set(this.ref(this.db,LP+this.code),{v:1,maj:this.serverTimestamp(),donnees:s}).catch(()=>{})}});
    if(cloud.code)cloud.pushNow();return cloud}catch(e){cloudErr=e.code||e.message||'erreur';console.warn('Firebase indisponible : sauvegarde locale uniquement',e);return null}})();return cloudP}
function applyCloud(d){prof.pseudo=d.pseudo||'';prof.classe=d.classe||'';prof.cartes=d.cartes||[];prof.ok=d.ok|0;prof.tot=d.tot|0;prof.tuto=d.tuto?1:0;prof.robot=d.robot?1:0;prof.races=d.races|0;prof.passed=d.passed|0;prof.hist=d.hist||[];prof.q=d.q||{};prof.owned=CH.map(c=>c.rarete=='depart'||prof.cartes.includes(c.id)?1:0);passed=prof.passed;robotOn=prof.robot?1:0}
async function studentLogin(c){if(!A.firebase){say('Connexion indisponible : joue en invité.',0);return}
  say('Connexion…',1);const cl=await initCloud();if(!cl){say('Connexion impossible ('+cloudErr+') : joue en invité.',0);return}
  try{const sn=await cl.get(cl.ref(cl.db,LP+c));
    if(sn.exists()){let d={};try{d=JSON.parse(sn.val().donnees||'{}')}catch(e){}askConfirm(d,()=>{applyCloud(d);cl.code=prof.code=c;save();cl.pushNow();mode='hub'})}
    else askIdentity(c,()=>{cl.code=prof.code=c;save();cl.pushNow();mode='hub'})}
  catch(e){say('Connexion refusée ('+(e.code||'erreur')+') : joue en invité.',0)}}
const connectCode=()=>{if(code.length!=4){say('Entre ton code à 4 chiffres.',0);return}studentLogin(code)};
function studentLogout(){if(cloud&&cloud.code)cloud.pushNow();const st=CH.map(c=>c.rarete=='depart'?1:0);for(const k of Object.keys(prof))delete prof[k];Object.assign(prof,{owned:st,ok:0,tot:0,pseudo:'',classe:'',ver:2});passed=0;robotOn=0;if(cloud)cloud.code='';code='';save();say('Déconnecté. À bientôt !',1)}   // poste partagé : la progression reste dans le compte, pas sur l'ordinateur
const ovl=h=>{paused=1;const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(3,6,25,.94);display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#fff;z-index:9';d.innerHTML='<div style="background:#0b1038;border:3px solid #22e6ff;border-radius:18px;padding:28px;width:min(92vw,420px)">'+h+'</div>';document.body.appendChild(d);return d};
const BTN='width:100%;padding:12px;font-size:18px;font-weight:bold;border:0;border-radius:10px;background:#22e6ff;cursor:pointer;margin-bottom:8px',BTN2='width:100%;padding:8px;font-size:15px;border:0;border-radius:10px;background:#1b2350;color:#9fe8ff;cursor:pointer',INP='width:100%;box-sizing:border-box;padding:10px;font-size:18px;border-radius:8px;border:0;margin-bottom:10px';
function askConfirm(d,ok){const e=s=>String(s==null?'':s).replace(/[<>&]/g,'');const o=ovl('<h2 style="margin:0 0 8px">Profil trouvé</h2><p style="margin:0 0 16px;color:#9fe8ff">Pseudo : <b>'+e(d.pseudo)+'</b> · classe '+e(d.classe||'—')+' · '+(d.cartes||[]).length+' carte(s)<br>C’est bien toi ?</p><button id="oui" style="'+BTN+'">Oui, c’est moi</button><button id="non" style="'+BTN2+'">Non, autre code</button>');
  o.querySelector('#oui').onclick=()=>{o.remove();paused=0;ok()};o.querySelector('#non').onclick=()=>{o.remove();paused=0}}
function finishIdentity(p,cl,c,ok){prof.pseudo=p;prof.classe=cl;ok()}
function askIdentity(c,ok){const o=ovl('<h2 style="margin:0 0 6px">Nouveau profil de pilote</h2><p style="margin:0 0 14px;color:#9fe8ff;font-size:14px">Ton code <b>'+String(c).replace(/[<>&]/g,'')+'</b> est ton identifiant : <b>retiens-le</b>, il te permettra de retrouver tes cartes. Choisis un pseudo <b>sans ton vrai nom</b>.</p><input id="ps" maxlength="16" placeholder="Pseudo" style="'+INP+'"><input id="cl" maxlength="12" placeholder="Classe (ex. 4A)" style="'+INP+'"><button id="go" style="'+BTN+'">Jouer</button><button id="no" style="'+BTN2+'">Annuler</button>');
  o.querySelector('#go').onclick=()=>{const p=o.querySelector('#ps').value.trim();if(p.length<2){o.querySelector('#ps').focus();return}o.remove();paused=0;finishIdentity(p,o.querySelector('#cl').value.trim(),c,ok)};o.querySelector('#no').onclick=()=>{o.remove();paused=0}}
function askCode(){const o=ovl('<h2 style="margin:0 0 12px">Ton code à 4 chiffres</h2><input id="cd" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" style="'+INP+';text-align:center;font-size:30px;letter-spacing:10px"><button id="ok" style="'+BTN+'">Valider</button><button id="no" style="'+BTN2+'">Annuler</button>');
  const go=()=>{const v=o.querySelector('#cd').value.replace(/\D/g,'').slice(0,4);o.remove();paused=0;code=v;if(v.length==4)connectCode()};o.querySelector('#ok').onclick=go;o.querySelector('#cd').onkeydown=e=>{if(e.key=='Enter')go()};o.querySelector('#no').onclick=()=>{o.remove();paused=0};o.querySelector('#cd').focus()}

// ===== CHARGEMENT =====
const load=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});
const lazy=(o,k,f)=>Object.defineProperty(o,k,{configurable:true,get(){const v=f();Object.defineProperty(o,k,{value:v,configurable:true});return v}});
function tint(im,rc){const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;const x=cv.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,cv.width,cv.height),p=d.data,[bh,th,ts,tm,ta]=rc;   // recolore les pixels de teinte « bh » : nouvelle teinte, saturation, luminosité
  for(let i=0;i<p.length;i+=4){if(!p[i+3])continue;let r=p[i]/255,g=p[i+1]/255,b=p[i+2]/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),df=mx-mn;let s=mx?df/mx:0,v=mx;if(s<=.35||v<=.25)continue;
    const h=df==0?0:mx==r?(((g-b)/df)%6+6)%6/6:mx==g?((b-r)/df+2)/6:((r-g)/df+4)/6;let dd=Math.abs(h-bh);dd=Math.min(dd,1-dd);if(dd>=.07)continue;
    s=Math.min(1,s*ts);v=Math.min(1,Math.max(0,v*tm+ta));const k=th*6,m=Math.floor(k)%6,f=k-Math.floor(k),pp=v*(1-s),q=v*(1-s*f),tt=v*(1-s*(1-f));
    [r,g,b]=[[v,tt,pp],[q,v,pp],[pp,v,tt],[pp,q,v],[tt,pp,v],[v,pp,q]][m];p[i]=r*255;p[i+1]=g*255;p[i+2]=b*255}
  x.putImageData(d,0,0);return cv}
async function init(){
  BG=await load(A.bg);
  for(const o of A.roadside){o.img=await load(o.u);o.ww=o.hh*o.img.width/o.img.height}
  for(const o of A.obst){o.img=await load(o.u);OB[o.n]=o}
  for(const c of A.chars){if(!c.base)for(const k of['tr','jump','step'])c[k]=await Promise.all(c[k].map(load));if(c.card)c.cardImg=await load(c.card);if(c.cardCar)c.cardCarImg=await load(c.cardCar)}for(const c of A.chars)if(c.base){const b=A.chars.find(x=>x.id==c.base);for(const k of['tr','jump','step'])lazy(c,k,()=>b[k].map(im=>tint(im,c.rc)))}   // variantes : sprites recolorés à la demande
  CH=A.chars;HOME=await load(A.home);const OLD=['rouge','jaune','camion','moto','citadine','f1','monster-truck','camping-car'];if(!prof.cartes)prof.cartes=OLD.filter((id,i)=>(prof.owned||[])[i]);   // reprise des anciennes sauvegardes
  autoRestore();if(prof.ver!==2){prof.cartes=[];prof.tuto=0;prof.dry=0;prof.dryR=0;prof.dryE=0;prof.ver=2}prof.cartes=prof.cartes||[];prof.owned=CH.map(c=>c.rarete=='depart'||prof.cartes.includes(c.id)?1:0);CH.forEach((c,i)=>{const k=c.famille||c.id;let f=FAM.find(x=>x.k==k);if(!f)FAM.push(f={k,v:[]});f.v.push(i)});passed=prof.passed|0;robotOn=prof.robot|0;
  const by=n=>A.roadside.filter(o=>o.n.startsWith(n)),pool=['pylon','lamp','billboard','house','tree','tree','light'];
  for(let i=8;i<N;i+=8)for(const side of[-1,1]){const l=by(pool[rnd()*pool.length|0]);segs[i].spr.push({o:l[rnd()*l.length|0],off:side*(1.35+rnd()*1.3)})}
  for(let i=0;i<N;i+=5){const s=segs[i];
    if(s.curve>1.2)s.spr.push({o:by('chevron')[0],off:-1.18});else if(s.curve<-1.2)s.spr.push({o:by('chevron')[0],off:1.18,flip:1});
    else if(i%40==0)s.spr.push({o:by('barrier')[0],off:(i%80?-1:1)*1.12})}
  for(let z=GATE0;z<SPR0-12000;z+=EVERY){const gt={z};newQ(gt);gates.push(gt);segs[z/SEG|0].gate=gt}
  for(let z=SPR0;z<LEN-3000;z+=6000){const gt={z};newS(gt);gates.push(gt);segs[z/SEG|0].gate=gt}   // sprint final : rangées d’obstacles sans question

  requestAnimationFrame(loop);initCloud()}

// ===== ACTIONS (clavier, souris et plus tard tactile appellent les mêmes fonctions) =====
const clampL=l=>Math.max(0,Math.min(3,l)),lk=()=>gates.some(t=>!t.sp&&!t.done&&t.L!==undefined),setLn=l=>{if(!lk())ln=clampL(l)};
function toggle(){if(!robotOn){say('Le robot se débloque en progressant : réponds aux consignes !',1);return}if(tr.t>0||cool>0||act.t>0)return;form^=1;tr={t:TR,dir:form?1:-1};cool=TR+COOL}

function hit(gt){gt.done=1;let L=gt.L!==undefined?gt.L:clampL(Math.round((x+.75)/.5)),ideal=(gt.t=='barrier'||gt.t=='ramp')?0:1;if(cheat.ok)L=gt.c;

  tot++;prof.tot++;passed++;lapTot++;const rec=gt.k&&!tp?((prof.q=prof.q||{})[gt.k]=prof.q[gt.k]||{o:0,k:0}):null;
  if(L==gt.c){ok++;prof.ok++;lapOk++;score+=10;rec&&rec.o++;
    if(form==ideal){gauge=Math.min(100,gauge+50);startAct();say('Bonne réponse ! '+(form?'Enjambement':'Saut')+' réussi : jauge de boost +50',1)}
    else{gauge=Math.min(100,gauge+25);slowT=1.5;say('Bonne réponse (+25), mais pas la bonne forme : tu passes en forçant',1)}}
  else{rec&&rec.k++;v*=.45;shake=.4;say('Raté ! '+gt.e,0)}
  chk();save()}

  const s=segs[pos/SEG|0],road=MAXV*Math.min(1,.3+.07*passed),vmax=road*(form?ROBOT:1)*(boosting&&gauge>0?BOOST:1)*(slowT>0?.6:1);if(boosting&&gauge>0)gauge=Math.max(0,gauge-DRAIN*dt);

  v+=Math.sign(vmax-v)*Math.min(Math.abs(vmax-v),ACC*dt*(v>vmax?2:1));
  for(const gt of gates)if(!gt.sp&&!gt.done&&gt.L===undefined&&pos>=gt.z-LOCK){gt.L=clampL(Math.round((x+.75)/.5));ln=gt.L}   // verrouillage de la réponse

  if(st)for(let l=1;l<LANES;l++){const f=l/LANES*2-1,xa=a.sx+a.sw*f,xb=b.sx+b.sw*f,wa=a.sw*.012,wb=b.sw*.012;quad(xa-wa,a.sy,xa+wa,a.sy,xb+wb,b.sy,xb-wb,b.sy,'#e8f4ff')}
  if(s.fog>.01){g.globalAlpha=s.fog;g.fillStyle='#1a1f5e';g.fillRect(0,b.sy,W,a.sy-b.sy);g.globalAlpha=1}}
function gate(s){const a=s.a,gt=s.gate,sc=a.sc,hp=h=>sc*h*H/2,L=a.sx-a.sw,R=a.sx+a.sw,top=a.sy-hp(3000),pw=Math.max(3,a.sw*.05);
  g.globalAlpha=Math.max(.65,1-s.fog);
  for(let i=0;i<LANES;i++){let k=1;   // toutes les voies sont bloquées ; le bloc de la bonne voie s’efface seulement si tu y es au moment du verrouillage
    if(gt.sp){if(i==gt.c)continue}else if(gt.L!==undefined&&gt.L==gt.c&&i==gt.c){k=1-Math.min(1,(pos-(gt.z-LOCK))/(LOCK*.5));if(k<=0)continue}
    const o=OB[gt.t],w=sc*o.ww*W/2,h=w*o.img.height/o.img.width*k;g.globalAlpha=Math.max(.65,1-s.fog)*k;g.drawImage(o.img,a.sx+a.sw*LX[i]-w/2,a.sy-h,w,h)}
  g.globalAlpha=Math.max(.65,1-s.fog);
  if(gt.sp){g.globalAlpha=1;return}
  g.fillStyle='#1d2a55';g.fillRect(L-pw*1.6,top,pw*1.6,a.sy-top);g.fillRect(R,top,pw*1.6,a.sy-top);
  g.fillStyle='#2b3a6b';g.fillRect(L-pw*1.6,top,R-L+pw*3.2,hp(380));g.fillStyle='#22e6ff';g.fillRect(L-pw*1.6,top+hp(380)-Math.max(2,hp(40)),R-L+pw*3.2,Math.max(2,hp(40)));
  const pwid=a.sw*.46,ph=hp(1500),py=top+hp(430);
  for(let i=0;i<LANES;i++){const cx=a.sx+a.sw*LX[i];g.fillStyle='#071433';g.fillRect(cx-pwid/2,py,pwid,ph);g.strokeStyle='#22e6ff';g.lineWidth=Math.max(1,hp(30));g.strokeRect(cx-pwid/2,py,pwid,ph);
    let fs=Math.max(7,ph*.45);g.font='bold '+fs+'px system-ui,sans-serif';while(g.measureText(gt.w[i]).width>pwid*.9&&fs>6){fs--;g.font='bold '+fs+'px system-ui,sans-serif'}
    g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(gt.w[i],cx,py+ph/2);g.textAlign='left';g.textBaseline='alphabetic'}
  g.globalAlpha=1}
function player(){const c=CH[car];let im,lift=0;
  if(act.t>0){const u=1-act.t/act.d,f=act.k=='jump'?c.jump:c.step;im=f[u<.25?0:u<.75?1:2];lift=Math.sin(Math.PI*u)*(act.k=='jump'?90:35)}
  else if(tr.t>0){const u=1-tr.t/TR,n=c.tr.length;im=c.tr[Math.min(n-1,Math.floor((tr.dir>0?u:1-u)*n))]}
  else im=form?c.tr[c.tr.length-1]:c.tr[0];
  const w=im.width/K,h=im.height/K,bob=Math.sin(pos/90)*v/MAXV*2;
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(W/2,H-14,w*.4*(1-lift/250),9,0,0,7);g.fill();
  g.drawImage(im,W/2-w/2,H-14-h-lift+bob,w,h)}
function wrap(t,mw){const out=[];let l='';for(const w of t.split(' ')){if(g.measureText(l+' '+w).width>mw&&l){out.push(l);l=w}else l=l?l+' '+w:w}out.push(l);return out}
function box(x1,y1,w,h,c){g.fillStyle=c;g.beginPath();g.roundRect(x1,y1,w,h,10);g.fill()}
function hud(){
  g.font='bold 18px system-ui,sans-serif';g.fillStyle='#fff';g.fillText(Math.round(v/MAXV*260)+' km/h · '+(form?'ROBOT':'VOITURE')+(boosting&&gauge>0?' · BOOST':''),20,H-76);
  g.fillText('Tour '+(lap+1)+' · '+lapT.toFixed(1)+' s · score '+score+' ('+ok+'/'+tot+')',20,H-54);
  g.font='13px system-ui,sans-serif';g.fillStyle='#9fe8ff';g.fillText(Math.round(fps)+' images/s · '+CH[car].label,20,H-34);
  g.fillText('← → ou clic sur une voie · Espace = transformer · B ou Maj (maintenu) = boost · Échap = pause',20,H-8);
  const ng=gates.find(t=>!t.sp&&!t.done&&t.z>pos&&t.z-pos<SHOW);let ey=12;
  if(ng){g.font='bold 27px system-ui,sans-serif';const L=wrap(ng.q,770),bh=18+L.length*34;box(W/2-400,10,800,bh,'rgba(5,12,40,.9)');g.fillStyle='#fff';g.textAlign='center';L.forEach((t,i)=>g.fillText(t,W/2,44+i*34));
    g.font='bold 24px system-ui,sans-serif';ng.w.forEach((w,i)=>{const cx=W/2-400+i*200;box(cx,bh+16,192,44,i==ln?(lk()?'#c8720e':'#0e7fb8'):'rgba(5,12,40,.9)');g.fillStyle='#fff';g.fillText(w,cx+96,bh+46)});g.textAlign='left';ey=bh+68}
  if(msg.life>0){g.font='bold 17px system-ui,sans-serif';const L=wrap(msg.t,740),y=ey;box(W/2-390,y,780,14+L.length*24,msg.ok?'rgba(10,110,60,.92)':'rgba(150,25,40,.92)');g.fillStyle='#fff';g.textAlign='center';L.forEach((t,i)=>g.fillText(t,W/2,y+26+i*24));g.textAlign='left'}
  btns=[];g.font='13px system-ui,sans-serif';g.fillStyle='#9fe8ff';g.textAlign='right';g.fillText(CH[car].label+'  ·  '+own()+' cartes',W-20,22);g.textAlign='left';
  btns.push({x:14,y:12,w:52,h:52,f:()=>{pz=1;boosting=0}});g.fillStyle='rgba(5,12,40,.88)';g.strokeStyle='#22e6ff';g.lineWidth=3;g.beginPath();g.roundRect(14,12,52,52,12);g.fill();g.stroke();g.fillStyle='#fff';g.fillRect(31,26,6,24);g.fillRect(43,26,6,24);   // bouton pause
  const bx=W-86,by=H-190,ready=robotOn&&cool<=0&&act.t<=0;btns.push({x:bx-46,y:by-46,w:92,h:92,f:toggle});
  g.fillStyle=ready?'rgba(5,40,70,.9)':'rgba(40,40,50,.85)';g.beginPath();g.arc(bx,by,46,0,7);g.fill();g.strokeStyle=ready?'#22e6ff':'#667';g.lineWidth=4;g.stroke();
  if(!ready&&cool>0){g.strokeStyle='#22e6ff';g.beginPath();g.arc(bx,by,40,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-cool/(TR+COOL)));g.stroke()}
  g.fillStyle='#fff';g.font='bold 30px system-ui';g.textAlign='center';g.fillText('⇄',bx,by+6);g.font='bold 12px system-ui';g.fillText(!robotOn?'VERROUILLÉ':form?'→ VOITURE':'→ ROBOT',bx,by+26);
  const gx=W-86,gy=H-300;btns.push({x:gx-46,y:gy-46,w:92,h:92,f:()=>boosting=1});
  g.fillStyle=boosting&&gauge>0?'rgba(120,60,0,.95)':'rgba(40,25,10,.9)';g.beginPath();g.arc(gx,gy,46,0,7);g.fill();g.strokeStyle='#5a4a30';g.lineWidth=4;g.stroke();
  g.strokeStyle='#ffb020';g.beginPath();g.arc(gx,gy,40,-Math.PI/2,-Math.PI/2+Math.PI*2*gauge/100);g.stroke();
  g.fillStyle='#fff';g.font='bold 14px system-ui';g.fillText('BOOST',gx,gy-2);g.font='bold 12px system-ui';g.fillText(Math.round(gauge)+' %',gx,gy+16);g.textAlign='left'}
function render(){
  g.save();if(shake>0)g.translate((Math.random()-.5)*12,(Math.random()-.5)*12);
  g.fillStyle='#0a0f33';g.fillRect(-20,-20,W+40,H+40);
  const k=.72,tw=BG.width*k,th=BG.height*k,top=H/2+8-435*k;
  for(let t=Math.floor(bgX/tw);t*tw-bgX<W;t++){g.save();g.translate(t*tw-bgX+(t&1?tw:0),top);if(t&1)g.scale(-1,1);g.drawImage(BG,0,0,tw,th);g.restore()}
  g.fillStyle='#0b1038';g.fillRect(-20,H/2+8,W+40,H);
  const b=segs[Math.max(0,Math.min(N-1,pos/SEG|0))],bp=Math.max(0,Math.min(1,pos%SEG/SEG)),py=b.a.wy+(b.b.wy-b.a.wy)*bp;let cx=0,dc=-b.curve*bp,maxy=H;vis=[];
  for(let n=0;n<DRAW;n++){const s=segs[(b.i+n)%N],cz=pos-(s.i<b.i?LEN:0);
    pr(s.a,x*ROAD-cx,py+CAMH,cz);pr(s.b,x*ROAD-cx-dc,py+CAMH,cz);cx+=dc;dc+=s.curve;s.clip=maxy;s.fog=1-1/Math.exp(n/DRAW*n/DRAW*FOG);
    if(s.a.cz<=DEPTH||s.b.sy>=s.a.sy||s.b.sy>=maxy)continue;seg(s);vis.push(s);maxy=s.b.sy}
  for(let n=DRAW-1;n>0;n--){const s=segs[(b.i+n)%N];
    for(const q of s.spr){const o=q.o,sc=s.a.sc,w=sc*o.ww*W/2,h=w*o.img.height/o.img.width,sx=s.a.sx+sc*q.off*ROAD*W/2-w/2,sy=s.a.sy-h,cl=Math.max(0,sy+h-s.clip);
      if(cl<h&&s.a.cz>DEPTH){const sh=o.img.height*(1-cl/h);g.globalAlpha=1-s.fog;
        if(q.flip){g.save();g.translate(sx+w,sy);g.scale(-1,1);g.drawImage(o.img,0,0,o.img.width,sh,0,0,w,h-cl);g.restore()}else g.drawImage(o.img,0,0,o.img.width,sh,sx,sy,w,h-cl);g.globalAlpha=1}}
    if(s.gate&&s.a.cz>DEPTH)gate(s)}
  player();g.restore();if(mode=='race'){hud();if(pz)pauseScreen()}else if(mode=='home'){home();profIcon()}else if(mode=='prof')profScreen();else if(mode=='hub')hub();else if(mode=='tuto')tuto();else if(mode=='menu')menu();else if(mode=='collection')collection();else resultScreen();if(reveal)card();if(surprise)surpriseScreen()}

let last=performance.now(),acc=0;
function loop(t){const f=Math.min(.25,(t-last)/1000);last=t;acc+=f;fps+=(1/Math.max(f,.001)-fps)*.05;requestAnimationFrame(loop);try{while(acc>=1/60){update(1/60);acc-=1/60}render()}catch(e){console.error('Lexicourse :',e);acc=0;if(g.reset)g.reset();else{g.setTransform(1,0,0,1,0,0);g.globalAlpha=1}}}   // la boucle ne s'arrête plus jamais, même en cas d'erreur
init();
</script></body></html>
